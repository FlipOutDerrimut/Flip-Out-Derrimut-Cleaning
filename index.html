<script>
  // --- IndexedDB Browser Storage Helper ---
  const DB_NAME = 'FlipOutSafetyDB';
  const STORE_NAME = 'daily_report';

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  // Save an item (checkbox state, text, or photo file)
  async function saveLocalItem(key, value) {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
  }

  // Retrieve an item
  async function getLocalItem(key) {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result);
    });
  }

  // Get all stored checklist data
  async function getAllLocalData() {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.openCursor();
      const data = {};
      
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          data[cursor.key] = cursor.value;
          cursor.continue();
        } else {
          resolve(data);
        }
      };
    });
  }

  // Wipe the memory clean (Self-Destruct)
  async function clearLocalData() {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
  }

  // --- Auto-Save Listener Setup ---
  document.addEventListener('DOMContentLoaded', async () => {
    // 1. Restore previous state on page load
    const savedData = await getAllLocalData();
    for (const [id, val] of Object.entries(savedData)) {
      const input = document.getElementById(id);
      if (input) {
        if (input.type === 'checkbox') input.checked = val;
        else if (input.type === 'text' || input.type === 'textarea') input.value = val;
      }
    }

    // 2. Auto-save inputs on tap/change
    document.querySelectorAll('input, textarea').forEach(element => {
      element.addEventListener('change', async (e) => {
        if (e.target.type === 'file') {
          // Store photos as base64 strings locally
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = () => saveLocalItem(e.target.id, reader.result);
            reader.readAsDataURL(file);
          }
        } else if (e.target.type === 'checkbox') {
          saveLocalItem(e.target.id, e.target.checked);
        } else {
          saveLocalItem(e.target.id, e.target.value);
        }
      });
    });
  });
</script>
