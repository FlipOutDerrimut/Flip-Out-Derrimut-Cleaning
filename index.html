<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Out - Daily Checklists</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --flipout-green: #99C63E;
      --flipout-velvet: #0F041D;
      --bg-card: #1A0B2E;
      --text-light: #FFFFFF;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--flipout-velvet);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 2rem;
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid rgba(153, 198, 62, 0.2);
    }

    h1, h2 {
      margin-top: 0;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0B0314;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      background-color: var(--flipout-green);
      color: var(--flipout-velvet);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .error-message {
      color: #ff5555;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="container">
    <h2>Flip Out Staff Login</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Staff Email</label>
        <input type="email" id="email" required placeholder="staff@flipout.com.au" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit">Sign In</button>
      <div id="login-error" class="error-message"></div>
    </form>
  </div>

  <!-- MAIN APP DASHBOARD (Hidden until logged in) -->
  <div id="app-screen" class="container hidden">
    <h1 style="color: var(--flipout-green);">Daily Checklists</h1>
    <p id="user-display" style="text-align: center; font-size: 0.9rem;"></p>
    
    <hr style="border-color: rgba(255,255,255,0.1); margin: 1.5rem 0;">
    
    <div id="checklist-placeholder">
      <p style="text-align: center;">Select today's checklist to get started.</p>
    </div>

    <button id="logout-btn" style="background: transparent; color: #888; border: 1px solid #444; margin-top: 1rem;">
      Log Out
    </button>
  </div>

  <script>
    // 1. Initialise Supabase Client (Fill these in with your free Supabase credentials)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Elements
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const userDisplay = document.getElementById('user-display');
    const logoutBtn = document.getElementById('logout-btn');

    // 2. Handle Login Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        loginError.textContent = error.message;
      } else {
        showAppScreen(data.user);
      }
    });

    // 3. Handle Logout
    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      loginScreen.classList.remove('hidden');
      appScreen.classList.add('hidden');
    });

    // 4. Session Check on Load
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showAppScreen(session.user);
      }
    }

    function showAppScreen(user) {
      userDisplay.textContent = `Logged in as: ${user.email}`;
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
    }

    checkExistingSession();
  </script>
</body>
</html>
