<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Out - Daily Checklists</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --flipout-green: #99C63E;
      --flipout-velvet: #0F041D;
      --bg-card: #1A0B2E;
      --bg-input: #0B0314;
      --text-light: #FFFFFF;
      --text-muted: #A0A0A0;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 1.5rem 1rem;
      background-color: var(--flipout-velvet);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 2rem;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(153, 198, 62, 0.25);
    }

    .brand-title {
      color: var(--flipout-green);
      text-align: center;
      margin: 0 0 0.25rem 0;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 2rem;
    }

    .sub-title {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    /* Day Selector Navigation */
    .day-selector-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .day-tab {
      flex: 1;
      min-width: 70px;
      padding: 0.6rem 0.4rem;
      background: #25123E;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-muted);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-tab:hover {
      border-color: var(--flipout-green);
      color: #fff;
    }

    .day-tab.active {
      background: var(--flipout-green);
      color: var(--flipout-velvet);
      border-color: var(--flipout-green);
    }

    /* Active Checklist Card */
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .checklist-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      text-transform: capitalize;
    }

    .checklist-body {
      background: var(--bg-input);
      border-radius: 10px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 200px;
    }

    /* Admin Footer Section */
    .footer {
      margin-top: 2rem;
      text-align: center;
    }

    .admin-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid #332244;
      background: var(--bg-input);
      color: #fff;
      font-size: 1rem;
    }

    .btn-primary {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 8px;
      background-color: var(--flipout-green);
      color: var(--flipout-velvet);
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .error-message {
      color: #FF5555;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- MAIN CHECKLIST INTERFACE (Default for iPad/Staff) -->
  <div id="main-app" class="container">
    <h1 class="brand-title">Flip Out</h1>
    <div class="sub-title">Daily Cleaning & Maintenance Checklist</div>

    <!-- Day Navigation Bar -->
    <div class="day-selector-container">
      <button class="day-tab" data-day="monday">Mon</button>
      <button class="day-tab" data-day="tuesday">Tue</button>
      <button class="day-tab" data-day="wednesday">Wed</button>
      <button class="day-tab" data-day="thursday">Thu</button>
      <button class="day-tab" data-day="friday">Fri</button>
      <button class="day-tab" data-day="saturday">Sat</button>
      <button class="day-tab" data-day="sunday">Sun</button>
    </div>

    <!-- Active Day Checklist Display -->
    <div class="checklist-header">
      <div id="active-day-title" class="checklist-title">Today's Checklist</div>
      <span id="completion-status" style="font-size: 0.85rem; color: var(--flipout-green);">0% Completed</span>
    </div>

    <div id="checklist-container" class="checklist-body">
      <p style="color: var(--text-muted); text-align: center;">Loading checklist items...</p>
    </div>

    <div class="footer">
      <button id="show-admin-btn" class="admin-link">Back Office Login</button>
    </div>
  </div>

  <!-- ADMIN LOGIN MODAL / SCREEN (Hidden by default) -->
  <div id="admin-screen" class="container hidden">
    <h1 class="brand-title">Back Office</h1>
    <div class="sub-title">Admin Authentication</div>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="admin-email">Admin Email</label>
        <input type="email" id="admin-email" placeholder="admin@flipout.com.au" required />
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary">Login to Admin Portal</button>
      <div id="admin-error" class="error-message"></div>
    </form>

    <div class="footer">
      <button id="back-to-app-btn" class="admin-link">← Return to Daily Checklist</button>
    </div>
  </div>

  <script>
    // Initialise Supabase Client
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    let currentSelectedDay = days[new Date().getDay()];

    // DOM Elements
    const mainApp = document.getElementById('main-app');
    const adminScreen = document.getElementById('admin-screen');
    const showAdminBtn = document.getElementById('show-admin-btn');
    const backToAppBtn = document.getElementById('back-to-app-btn');
    const activeDayTitle = document.getElementById('active-day-title');
    const checklistContainer = document.getElementById('checklist-container');
    const dayTabs = document.querySelectorAll('.day-tab');

    // Automatically load current day on page start
    function initialiseApp() {
      selectDay(currentSelectedDay);
    }

    // Handle Switching Days
    function selectDay(dayName) {
      currentSelectedDay = dayName;
      
      // Update UI Tabs
      dayTabs.forEach(tab => {
        if (tab.dataset.day === dayName) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      // Update Header
      const isToday = days[new Date().getDay()] === dayName;
      activeDayTitle.textContent = `${dayName.toUpperCase()} ${isToday ? '(Today)' : ''}`;

      // Load tasks (Placeholder until database connection)
      renderChecklistItems(dayName);
    }

    function renderChecklistItems(day) {
      checklistContainer.innerHTML = `
        <p style="color: var(--flipout-green); font-weight: 500;">Ready for ${day.toUpperCase()} tasks.</p>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Tasks and photo upload fields for this day will load here automatically.</p>
      `;
    }

    // Tab Click Listeners
    dayTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        selectDay(tab.dataset.day);
      });
    });

    // Navigation Toggle for Back Office
    showAdminBtn.addEventListener('click', () => {
      mainApp.classList.add('hidden');
      adminScreen.classList.remove('hidden');
    });

    backToAppBtn.addEventListener('click', () => {
      adminScreen.classList.add('hidden');
      mainApp.classList.remove('hidden');
    });

    initialiseApp();
  </script>
</body>
</html>
