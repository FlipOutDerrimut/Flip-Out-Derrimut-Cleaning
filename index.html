<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Out - Daily Checklists</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --flipout-green: #99C63E;
      --flipout-velvet: #0F041D;
      --bg-card: #1A0B2E;
      --bg-input: #0B0314;
      --text-light: #FFFFFF;
      --text-muted: #A0A0A0;
      --danger: #FF5555;
      --warning: #FFB703;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 1.5rem 1rem;
      background-color: var(--flipout-velvet);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      padding: 2rem;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(153, 198, 62, 0.25);
    }

    .brand-title {
      color: var(--flipout-green);
      text-align: center;
      margin: 0 0 0.25rem 0;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 2rem;
    }

    .sub-title {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    /* Day Selector Navigation */
    .day-selector-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .day-tab {
      flex: 1;
      min-width: 60px;
      padding: 0.6rem 0.4rem;
      background: #25123E;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-muted);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-tab.active {
      background: var(--flipout-green);
      color: var(--flipout-velvet);
      border-color: var(--flipout-green);
    }

    /* Checklist Cards */
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .checklist-title {
      font-size: 1.25rem;
      font-weight: bold;
      text-transform: capitalize;
    }

    .task-card {
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-checkbox {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: var(--flipout-green);
      cursor: pointer;
    }

    .task-label {
      font-size: 1rem;
      flex-grow: 1;
      line-height: 1.4;
    }

    .task-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-left: 34px;
      flex-wrap: wrap;
    }

    .initials-input {
      width: 100px;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #443355;
      background: #18092B;
      color: #fff;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .photo-upload-btn {
      background: #2E174D;
      border: 1px solid var(--flipout-green);
      color: #fff;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Back Office Styles */
    .admin-task-item {
      background: #25123E;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-actions {
      display: flex;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #332244;
      background: var(--bg-input);
      color: #fff;
      font-size: 0.95rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 0.4rem;
    }

    .day-checkbox-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      background: #18092B;
      padding: 6px 2px;
      border-radius: 6px;
      border: 1px solid #332244;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background-color: var(--flipout-green);
      color: var(--flipout-velvet);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-secondary {
      background: #2E174D;
      border: 1px solid var(--flipout-green);
      color: #fff;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .footer {
      margin-top: 2rem;
      text-align: center;
    }

    .admin-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .error-message {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 1. STAFF CHECKLIST VIEW (iPad Default) -->
  <div id="main-app" class="container">
    <h1 class="brand-title">Flip Out</h1>
    <div class="sub-title">Daily Operations Checklist</div>

    <div class="day-selector-container">
      <button class="day-tab main-day-tab" data-day="monday">Mon</button>
      <button class="day-tab main-day-tab" data-day="tuesday">Tue</button>
      <button class="day-tab main-day-tab" data-day="wednesday">Wed</button>
      <button class="day-tab main-day-tab" data-day="thursday">Thu</button>
      <button class="day-tab main-day-tab" data-day="friday">Fri</button>
      <button class="day-tab main-day-tab" data-day="saturday">Sat</button>
      <button class="day-tab main-day-tab" data-day="sunday">Sun</button>
    </div>

    <div class="checklist-header">
      <div id="active-day-title" class="checklist-title">Today's Tasks</div>
    </div>

    <div id="checklist-container">
      <p style="text-align: center; color: var(--text-muted);">Loading tasks from database...</p>
    </div>

    <div class="footer">
      <button id="show-admin-login-btn" class="admin-link">Back Office Access</button>
    </div>
  </div>

  <!-- 2. ADMIN LOGIN SCREEN -->
  <div id="admin-login-screen" class="container hidden">
    <h1 class="brand-title">Back Office</h1>
    <div class="sub-title">Admin Login</div>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="admin-email">Admin Email</label>
        <input type="email" id="admin-email" placeholder="admin@flipout.com.au" required />
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary">Authenticate</button>
      <div id="admin-error" class="error-message"></div>
    </form>

    <div class="footer">
      <button id="back-to-app-btn-1" class="admin-link">← Return to Checklist Portal</button>
    </div>
  </div>

  <!-- 3. BACK OFFICE TASK MANAGER (Logged In) -->
  <div id="back-office-screen" class="container hidden">
    <h1 class="brand-title">Back Office</h1>
    <div class="sub-title">Manage Checklist Tasks</div>

    <form id="task-form" style="margin-bottom: 2rem; background: var(--bg-input); padding: 1.25rem; border-radius: 10px;">
      <input type="hidden" id="editing-task-id" value="" />
      <h3 id="form-heading" style="margin-top: 0; color: var(--flipout-green); font-size: 1.1rem;">Add New Task</h3>
      
      <div class="form-group">
        <label for="new-task-title">Task Description</label>
        <input type="text" id="new-task-title" placeholder="e.g. Disinfect party room tables" required />
      </div>

      <div class="form-group">
        <label for="new-task-category">Category</label>
        <select id="new-task-category">
          <option value="Opening">Opening</option>
          <option value="Safety Checks">Safety Checks</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Closing">Closing</option>
        </select>
      </div>

      <div class="form-group">
        <label>Active Days</label>
        <div class="days-grid">
          <label class="day-checkbox-label"><input type="checkbox" class="day-check" value="monday" checked> Mon</label>
          <label class="day-checkbox-label"><input type="checkbox" class="day-check" value="tuesday" checked> Tue</label>
          <label class="day-checkbox-label"><input type="checkbox" class="day-check" value="wednesday" checked> Wed</label>
          <label class="day-checkbox-label"><input type="checkbox" class="day-check" value="thursday" checked> Thu</label>
          <label class="day-checkbox-label"><input type="checkbox" class="day-check" value="friday" checked> Fri</label>
          <label class="day-checkbox-label"><input type="checkbox" class="day-check" value="saturday" checked> Sat</label>
          <label class="day-checkbox-label"><input type="checkbox" class="day-check" value="sunday" checked> Sun</label>
        </div>
      </div>

      <div style="display: flex; gap: 1rem; margin-bottom: 1.25rem;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem;">
          <input type="checkbox" id="new-task-photo" style="width: auto;"> Requires Photo
        </label>
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem;">
          <input type="checkbox" id="new-task-initials" checked style="width: auto;"> Requires Initials
        </label>
      </div>

      <div style="display: flex; gap: 10px;">
        <button type="submit" id="submit-task-btn" class="btn-primary">+ Save Task to Database</button>
        <button type="button" id="cancel-edit-btn" class="btn-danger hidden">Cancel Edit</button>
      </div>
    </form>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
      <h3 style="margin: 0; font-size: 1.1rem;">Active Database Tasks</h3>
    </div>

    <!-- BACK OFFICE DAY FILTER -->
    <div class="day-selector-container">
      <button class="day-tab admin-filter-tab active" data-filter="all">All</button>
      <button class="day-tab admin-filter-tab" data-filter="monday">Mon</button>
      <button class="day-tab admin-filter-tab" data-filter="tuesday">Tue</button>
      <button class="day-tab admin-filter-tab" data-filter="wednesday">Wed</button>
      <button class="day-tab admin-filter-tab" data-filter="thursday">Thu</button>
      <button class="day-tab admin-filter-tab" data-filter="friday">Fri</button>
      <button class="day-tab admin-filter-tab" data-filter="saturday">Sat</button>
      <button class="day-tab admin-filter-tab" data-filter="sunday">Sun</button>
    </div>

    <div id="admin-task-list">
      <p style="text-align: center; color: var(--text-muted);">Loading tasks...</p>
    </div>

    <div class="footer" style="display: flex; justify-content: space-between; align-items: center;">
      <button id="logout-btn" class="btn-danger">Sign Out</button>
      <button id="back-to-app-btn-2" class="admin-link">← Return to Portal</button>
    </div>
  </div>

  <script>
    // Initialise Supabase Client
    const SUPABASE_URL = 'https://rtgmpmmcplxwezsleclj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PxJuEvkUbVmqNlcq-E2sPg_VBn5vI3F';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    let currentSelectedDay = days[new Date().getDay()];
    let allLoadedTasks = [];
    let activeAdminFilter = 'all';

    // DOM Elements
    const mainApp = document.getElementById('main-app');
    const adminLoginScreen = document.getElementById('admin-login-screen');
    const backOfficeScreen = document.getElementById('back-office-screen');
    const checklistContainer = document.getElementById('checklist-container');
    const adminTaskList = document.getElementById('admin-task-list');
    const mainDayTabs = document.querySelectorAll('.main-day-tab');
    const adminFilterTabs = document.querySelectorAll('.admin-filter-tab');

    // 1. Initialise App
    async function initialiseApp() {
      selectDay(currentSelectedDay);
      checkSession();
    }

    // 2. Select & Fetch Day Tasks from Database
    async function selectDay(dayName) {
      currentSelectedDay = dayName;
      
      mainDayTabs.forEach(tab => {
        tab.classList.toggle('active', tab.dataset.day === dayName);
      });

      const isToday = days[new Date().getDay()] === dayName;
      document.getElementById('active-day-title').textContent = `${dayName.toUpperCase()} ${isToday ? '(Today)' : ''}`;

      checklistContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Loading tasks...</p>`;

      const { data: tasks, error } = await supabaseClient
        .from('tasks')
        .select('*')
        .contains('days', [dayName]);

      if (error) {
        checklistContainer.innerHTML = `<p class="error-message">Error loading tasks: ${error.message}</p>`;
        return;
      }

      if (!tasks || tasks.length === 0) {
        checklistContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No tasks assigned for ${dayName}.</p>`;
        return;
      }

      checklistContainer.innerHTML = tasks.map(task => `
        <div class="task-card">
          <div class="task-main">
            <input type="checkbox" class="task-checkbox" id="task-${task.id}">
            <label class="task-label" for="task-${task.id}">${task.title}</label>
          </div>
          <div class="task-meta">
            ${task.requires_initials ? `<input type="text" class="initials-input" placeholder="Initials" maxlength="4">` : ''}
            ${task.requires_photo ? `
              <label class="photo-upload-btn">
                📷 Take Photo
                <input type="file" accept="image/*" capture="camera" style="display:none;">
              </label>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    // 3. Back Office Functions
    async function loadAdminTasks() {
      const { data: tasks, error } = await supabaseClient.from('tasks').select('*').order('created_at', { ascending: false });
      
      if (error || !tasks) {
        adminTaskList.innerHTML = `<p class="error-message">Could not load tasks.</p>`;
        return;
      }

      allLoadedTasks = tasks;
      renderAdminTaskList();
    }

    function renderAdminTaskList() {
      let filteredTasks = allLoadedTasks;

      if (activeAdminFilter !== 'all') {
        filteredTasks = allLoadedTasks.filter(task => (task.days || []).includes(activeAdminFilter));
      }

      if (filteredTasks.length === 0) {
        adminTaskList.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 1rem;">No tasks found for ${activeAdminFilter.toUpperCase()}.</p>`;
        return;
      }

      adminTaskList.innerHTML = filteredTasks.map(task => `
        <div class="admin-task-item">
          <div style="flex-grow: 1; padding-right: 12px;">
            <strong>${task.title}</strong>
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
              Category: ${task.category} | Days: ${(task.days || []).map(d => d.substring(0,3).toUpperCase()).join(', ')}
            </div>
          </div>
          <div class="admin-actions">
            <button class="btn-secondary" onclick="startEditTask('${task.id}')">Edit</button>
            <button class="btn-danger" onclick="deleteTask('${task.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Edit Existing Task
    window.startEditTask = function(taskId) {
      const task = allLoadedTasks.find(t => t.id === taskId);
      if (!task) return;

      document.getElementById('editing-task-id').value = task.id;
      document.getElementById('new-task-title').value = task.title;
      document.getElementById('new-task-category').value = task.category;
      document.getElementById('new-task-photo').checked = task.requires_photo;
      document.getElementById('new-task-initials').checked = task.requires_initials;

      document.querySelectorAll('.day-check').forEach(cb => {
        cb.checked = (task.days || []).includes(cb.value);
      });

      document.getElementById('form-heading').textContent = 'Edit Task';
      document.getElementById('submit-task-btn').textContent = '✓ Update Task';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetTaskForm() {
      document.getElementById('editing-task-id').value = '';
      document.getElementById('new-task-title').value = '';
      document.getElementById('new-task-category').value = 'Opening';
      document.getElementById('new-task-photo').checked = false;
      document.getElementById('new-task-initials').checked = true;
      document.querySelectorAll('.day-check').forEach(cb => cb.checked = true);

      document.getElementById('form-heading').textContent = 'Add New Task';
      document.getElementById('submit-task-btn').textContent = '+ Save Task to Database';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    document.getElementById('cancel-edit-btn').addEventListener('click', resetTaskForm);

    // Save or Update Task Handler
    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editing-task-id').value;
      const title = document.getElementById('new-task-title').value;
      const category = document.getElementById('new-task-category').value;
      const requires_photo = document.getElementById('new-task-photo').checked;
      const requires_initials = document.getElementById('new-task-initials').checked;
      const selectedDays = Array.from(document.querySelectorAll('.day-check:checked')).map(cb => cb.value);

      if (selectedDays.length === 0) {
        alert('Please select at least one active day for this task.');
        return;
      }

      let result;
      if (editingId) {
        result = await supabaseClient.from('tasks').update({
          title,
          category,
          requires_photo,
          requires_initials,
          days: selectedDays
        }).eq('id', editingId);
      } else {
        result = await supabaseClient.from('tasks').insert([{
          title,
          category,
          requires_photo,
          requires_initials,
          days: selectedDays
        }]);
      }

      if (!result.error) {
        resetTaskForm();
        loadAdminTasks();
        selectDay(currentSelectedDay);
      } else {
        alert('Error saving task: ' + result.error.message);
      }
    });

    // Delete Task
    window.deleteTask = async function(id) {
      if (confirm('Are you sure you want to delete this task?')) {
        await supabaseClient.from('tasks').delete().eq('id', id);
        loadAdminTasks();
        selectDay(currentSelectedDay);
      }
    };

    // Auth Handlers
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('admin-error').textContent = error.message;
      } else {
        showBackOffice();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      showMainApp();
    });

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        loadAdminTasks();
      }
    }

    function showMainApp() {
      mainApp.classList.remove('hidden');
      adminLoginScreen.classList.add('hidden');
      backOfficeScreen.classList.add('hidden');
    }

    function showBackOffice() {
      mainApp.classList.add('hidden');
      adminLoginScreen.classList.add('hidden');
      backOfficeScreen.classList.remove('hidden');
      loadAdminTasks();
    }

    // Navigation Listeners
    document.getElementById('show-admin-login-btn').addEventListener('click', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showBackOffice();
      } else {
        mainApp.classList.add('hidden');
        adminLoginScreen.classList.remove('hidden');
      }
    });

    document.getElementById('back-to-app-btn-1').addEventListener('click', showMainApp);
    document.getElementById('back-to-app-btn-2').addEventListener('click', showMainApp);

    mainDayTabs.forEach(tab => {
      tab.addEventListener('click', () => selectDay(tab.dataset.day));
    });

    adminFilterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        adminFilterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeAdminFilter = tab.dataset.filter;
        renderAdminTaskList();
      });
    });

    initialiseApp();
  </script>
</body>
</html>
